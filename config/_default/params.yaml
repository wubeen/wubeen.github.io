hugoblox:
  schema: "2.0"

  identity:
    name: "Bin Wu"
    organization: "Alibaba Cloud"
    type: person
    tagline: "Research Scientist / Senior Technology Research Expert"
    description: "Bin Wu — Research Scientist / Senior Technology Research Expert at Alibaba Cloud. Research and production work on Agentic RAG, NL2SQL, and AI agents."
    social:
      twitter: ""

  theme:
    mode: system
    pack: "default"
    colors:
      primary: "#1b3a4b"
      secondary: "#8c4a2f"
      neutral: "stone"
    colors_light: {}
    colors_dark:
      primary: "#d4c4a8"
      secondary: "#9ec4d4"
      neutral: "stone"
    surfaces:
      background: ""
      foreground: ""
      header:
        background: "#16324a"
        foreground: "#f7f4ee"
      footer:
        background: "#16324a"
        foreground: "#e7e2d8"

  typography:
    pack: "academic"

  layout:
    radius: "sm"
    spacing: "comfortable"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: left
    search: false
    theme_toggle: true
    theme_picker: false
    language_switcher: true
    cta:
      enable: false
      text: ""
      url: ""

  footer:
    style: minimal
    language_switcher: true
    text: ""

  copyright:
    notice: "© {year} Bin Wu. This work is licensed under {license}"
    license:
      type: cc
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  seo:
    title: ""
    location:
      address:
        street: ""
        city: ""
        region: ""
        postal_code: ""
        country: ""
      coordinates:
        latitude: null
        longitude: null
      phone: ""
    ai:
      allow:
        - /
      disallow: []
      note: ""
      contact: ""

  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: false
    citations:
      style: apa

  search:
    enable: true
    suggestions: []
    quick_actions: []

  comments:
    enable: false
    provider: ""
    giscus:
      repo: ""
      repo_id: ""
      category: ""
      category_id: ""
    disqus:
      shortname: ""

  analytics:
    google:
      measurement_id: ""
    google_tag_manager:
      container_id: ""
    plausible:
      domain: ""
    fathom:
      site_id: ""
    pirsch:
      site_id: ""
    clarity:
      project_id: ""
    baidu:
      site_id: ""

  verification:
    google: ""
    bing: ""
    baidu: ""
    yandex: ""
    pinterest: ""
    naver: ""

  repository:
    enable: false
    url: "https://github.com/wubeen/wubeen.github.io"
    branch: main
    content_dir: content

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  security:
    csp:
      policy: ""
      report_only: false
    frame_options: allow
    permissions_policy: ""

  privacy:
    enable: false
    anonymize_analytics: true

  debug:
    enable: false
    hud:
      position: bottom-left
      opacity: 1.0
    export_logs: true

  pro:
    hide_attribution: false
    affiliate_code: ""
